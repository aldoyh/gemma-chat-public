<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .rotating { animation: spin 2s linear infinite; transform-origin: 50% 50%; }
  </style>
  <circle cx="50" cy="50" r="40" stroke="%23fff" stroke-width="8" fill="none" class="rotating"/>
  <circle cx="50" cy="50" r="20" fill="%23fff"/>
</svg>